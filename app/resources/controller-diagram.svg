<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
    <!-- Definitions for animations -->
    <defs>
        <!-- Thermal display animation -->
        <g id="thermal-display-1">
            <circle cx="150" cy="100" r="40" fill="#FF0000" opacity="0.3"/>
            <circle cx="150" cy="100" r="30" fill="#FF4500" opacity="0.3"/>
            <circle cx="150" cy="100" r="20" fill="#FF8C00" opacity="0.3"/>
        </g>
        <g id="thermal-display-2">
            <circle cx="100" cy="80" r="35" fill="#FF0000" opacity="0.3"/>
            <circle cx="100" cy="80" r="25" fill="#FF4500" opacity="0.3"/>
            <circle cx="100" cy="80" r="15" fill="#FF8C00" opacity="0.3"/>
        </g>
        
        <!-- Camera display animation - Day/Night -->
        <g id="camera-day">
            <!-- Day scene -->
            <rect x="0" y="0" width="300" height="100" fill="#87CEEB" opacity="0.9"/> <!-- Bright blue sky -->
            <rect x="0" y="100" width="300" height="100" fill="#228B22" opacity="0.9"/> <!-- Bright green ground -->
            <circle cx="180" cy="50" r="30" fill="#FFFF00" opacity="0.9"/> <!-- Bright sun -->
            <!-- Day scene elements -->
            <rect x="40" y="120" width="30" height="40" fill="#8B4513"/> <!-- Tree trunk -->
            <circle cx="55" cy="105" r="25" fill="#006400"/> <!-- Tree top -->
        </g>
        <g id="camera-night">
            <!-- Night scene -->
            <rect x="0" y="0" width="300" height="100" fill="#191970" opacity="0.9"/> <!-- Dark blue night sky -->
            <rect x="0" y="100" width="300" height="100" fill="#003300" opacity="0.9"/> <!-- Dark ground -->
            <circle cx="200" cy="30" r="15" fill="#FFFFFF" opacity="0.8"/> <!-- Moon -->
            <!-- Stars -->
            <circle cx="50" cy="20" r="1" fill="#FFFFFF"/>
            <circle cx="100" cy="40" r="1" fill="#FFFFFF"/>
            <circle cx="150" cy="15" r="1" fill="#FFFFFF"/>
            <circle cx="250" cy="25" r="1" fill="#FFFFFF"/>
            <circle cx="280" cy="50" r="1" fill="#FFFFFF"/>
            <!-- Night scene elements -->
            <rect x="40" y="120" width="30" height="40" fill="#654321"/> <!-- Tree trunk darker -->
            <circle cx="55" cy="105" r="25" fill="#004400"/> <!-- Tree top darker -->
        </g>
    </defs>
    
    <!-- Straight antenna on left with centered sonar waves -->
    <line x1="70" y1="50" x2="70" y2="0" stroke="#303030" stroke-width="4"/>
    <circle cx="70" cy="0" r="3" fill="#303030"/>
    <!-- Centered expanding sonar waves -->
    <path d="M45,0 A25,25 0 0,1 95,0" stroke="#30FF30" stroke-width="2" fill="none" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M35,0 A35,35 0 0,1 105,0" stroke="#30FF30" stroke-width="2.5" fill="none" opacity="0.6">
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </path>
    <path d="M20,0 A50,50 0 0,1 120,0" stroke="#30FF30" stroke-width="3" fill="none" opacity="0.4">
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite" begin="1s"/>
    </path>
    
    <!-- Main controller body -->
    <rect x="50" y="50" width="700" height="400" rx="20" fill="#303030"/>
    
    <!-- Left screen (LIDAR/Thermal) -->
    <rect x="75" y="70" width="300" height="200" rx="5" fill="#212121" stroke="#404040"/>
    <!-- LIDAR/Thermal visualization pattern -->
    <g transform="translate(75,70)">
        <!-- Animated heat spots -->
        <g>
            <use href="#thermal-display-1">
                <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/>
            </use>
            <use href="#thermal-display-2">
                <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
            </use>
        </g>
        
        <!-- Grid pattern -->
        <path d="M0,50 H300 M0,100 H300 M0,150 H300" 
              stroke="#00FF00" stroke-width="1" opacity="0.2"/>
        <path d="M75,0 V200 M150,0 V200 M225,0 V200" 
              stroke="#00FF00" stroke-width="1" opacity="0.2"/>
              
        <!-- Distance markers -->
        <line x1="20" y1="180" x2="80" y2="180" stroke="#00FF00" stroke-width="1"/>
        <line x1="120" y1="180" x2="180" y2="180" stroke="#00FF00" stroke-width="1"/>
        <line x1="220" y1="180" x2="280" y2="180" stroke="#00FF00" stroke-width="1"/>
        
        <!-- Data readout -->
        <text x="10" y="20" fill="#00FF00" font-size="12">THERMAL</text>
        <text x="10" y="35" fill="#00FF00" font-size="10">
            <animate attributeName="textContent" values="T:27.4°C;T:28.2°C;T:27.8°C" dur="2s" repeatCount="indefinite"/>
        </text>
    </g>
    
    <!-- Right screen (camera view) -->
    <rect x="425" y="70" width="300" height="200" rx="5" fill="#212121" stroke="#404040"/>
    <!-- Camera view elements -->
    <g transform="translate(425,70)">
        <!-- Animated day/night camera scene -->
        <g>
            <use href="#camera-day">
                <animate attributeName="opacity" values="1;0;1" dur="4s" repeatCount="indefinite"/>
            </use>
            <use href="#camera-night">
                <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
            </use>
        </g>
        
        <!-- Camera overlay elements -->
        <circle cx="20" cy="20" r="5" fill="#FF0000" opacity="0.8"/>
        <path d="M140,90 H160 M150,80 V100" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>
        <text x="250" y="190" fill="#FFFFFF" font-size="10" opacity="0.8">REC</text>
        <text x="15" y="190" fill="#FFFFFF" font-size="10" opacity="0.8">
            <animate attributeName="textContent" values="00:42;00:43;00:44;00:45" dur="4s" repeatCount="indefinite"/>
        </text>
        <!-- Mode indicator that changes with day/night -->
        <text x="15" y="20" fill="#FFFFFF" font-size="10" opacity="0.8">
            <animate attributeName="textContent" values="DAY MODE;NIGHT MODE" dur="4s" repeatCount="indefinite"/>
        </text>
    </g>
    
    <!-- Left side controls -->
    <g transform="translate(120,350)">
        <!-- Left joystick (360 degrees) -->
        <circle cx="0" cy="0" r="25" fill="#404040" stroke="#505050" stroke-width="2"/>
        <circle cx="0" cy="0" r="20" fill="#666"/>
        <!-- Movement indicator -->
        <path d="M0,-15 L0,15 M-15,0 L15,0" stroke="#808080" stroke-width="1"/>
        <circle cx="0" cy="0" r="6" fill="#808080"/>
        
        <!-- Left side buttons -->
        <circle cx="80" cy="0" r="15" fill="#666"/>
        <circle cx="130" cy="0" r="15" fill="#666"/>
        <circle cx="180" cy="0" r="15" fill="#666"/>
    </g>
    
    <!-- Right side controls -->
    <g transform="translate(480,350)">
        <!-- Right side buttons -->
        <circle cx="0" cy="0" r="15" fill="#666"/>
        <circle cx="50" cy="0" r="15" fill="#666"/>
        <circle cx="100" cy="0" r="15" fill="#666"/>
        
        <!-- Right joystick (side-only) -->
        <circle cx="180" cy="0" r="25" fill="#404040" stroke="#505050" stroke-width="2"/>
        <circle cx="180" cy="0" r="20" fill="#666"/>
        <!-- Horizontal-only movement indicator -->
        <path d="M165,0 L195,0" stroke="#808080" stroke-width="1"/>
        <circle cx="180" cy="0" r="6" fill="#808080"/>
    </g>
</svg>
